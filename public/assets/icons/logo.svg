<svg width="170" height="34" viewBox="0 0 170 34" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Group -->
  <g transform="translate(1, 2)">
    <!-- Candlestick Bars -->
    <rect x="4" y="14" width="3.5" height="12" rx="1.5" fill="url(#barGrad)"/>
    <rect x="10" y="9" width="3.5" height="17" rx="1.5" fill="url(#barGrad)"/>
    <rect x="16" y="5" width="3.5" height="21" rx="1.5" fill="url(#barGrad)"/>
    <rect x="22" y="1" width="3.5" height="25" rx="1.5" fill="url(#barGrad)"/>
    
    <!-- Base Crescent Glow -->
    <path d="M2 22C4.5 27 12 30 18 29C23 28 27 24 28 20" stroke="url(#blueGlow)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rising Dynamic Trend Wave with Arrow -->
    <path d="M1 21L7 16L13 18L21 8L28 2" stroke="url(#logoGreen)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 2H28V8" stroke="url(#logoGreen)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="38" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#FFFFFF">Trade</tspan><tspan fill="url(#pulseGrad)">Pulse</tspan>
  </text>
</svg>
